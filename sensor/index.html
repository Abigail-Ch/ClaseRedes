<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Sistema de Sensores</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-container">

<div class="login-box">

<div class="avatar">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="4"/>
<path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
</svg>
</div>

<label>Usuario</label>
<input type="text" id="usuario">

<label>Contraseña</label>
<input type="password" id="password">

<button onclick="login()">LOGIN</button>

<p id="error"></p>

</div>
</div>


<!-- SISTEMA -->
<div id="sistema" style="display:none;">

<h1 class="titulo">Estado de los <span>Sensores</span></h1>


<!-- SECCION HUMEDAD -->

<section class="sensor">

<h2 class="sensor-titulo">SENSOR DE HÚMEDAD</h2>

<div class="sensor-contenido">

<div class="sensor-izquierda">

<img src="humedad.png" class="icono">

<input type="range" id="humedad" min="0" max="100" oninput="actualizar()">

<p class="valor">Humedad <span id="valorH">0%</span></p>

</div>

<div class="sensor-derecha">

<h3>Estado de monitoreo</h3>

<div class="led" id="ledH"></div>

</div>

</div>

</section>



<!-- SECCION TEMPERATURA -->

<section class="sensor">

<h2 class="sensor-titulo">SENSOR DE TEMPERATURA</h2>

<div class="sensor-contenido">

<div class="sensor-izquierda">

<img src="temperatura.png" class="icono">

<input type="range" id="temp" min="0" max="50" oninput="actualizar()">

<p class="valor">Temperatura <span id="valorT">0°C</span></p>

</div>

<div class="sensor-derecha">

<h3>Estado de monitoreo</h3>

<div class="led" id="ledT"></div>

</div>

</div>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
