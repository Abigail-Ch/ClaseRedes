<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Sistema de Monitoreo</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Pacifico&display=swap" rel="stylesheet">

</head>

<body>

<div class="titulo">
ESTADO DE LOS <span>Sensores</span>
</div>


<!-- SENSOR HUMEDAD -->

<div class="sensor">

<div class="etiqueta">
SENSOR DE HÚMEDAD
</div>

<div class="contenedor">

<div class="lado-izq">

<img src="img/humedad.png" class="icono">

<input type="range" id="humedad" min="0" max="100" value="40" oninput="actualizar()">

<p>Húmedad <span id="valorH">40</span>%</p>

</div>


<div class="lado-der">

<div class="monitor">

<h3>Estado de monitoreo</h3>

<img id="ledH" src="img/led_verde.png" class="led">

</div>

</div>

</div>

</div>



<!-- SENSOR TEMPERATURA -->

<div class="sensor">

<div class="etiqueta">
SENSOR DE TEMPERATURA
</div>

<div class="contenedor">

<div class="lado-izq">

<img src="img/temperatura.png" class="icono">

<input type="range" id="temp" min="0" max="50" value="20" oninput="actualizar()">

<p>Temperatura <span id="valorT">20</span>°C</p>

</div>


<div class="lado-der">

<div class="monitor">

<h3>Estado de monitoreo</h3>

<img id="ledT" src="img/led_azul.png" class="led">

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
