<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Monitoreo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-container">

    <div class="login-box">

        <div class="avatar"></div>

        <label>Contraseña</label>
        <input type="password" id="password">

        <label>Usuario</label>
        <input type="text" id="usuario">

        <button onclick="login()">LOGIN</button>

        <p id="error"></p>

    </div>

</div>


<!-- INTERFAZ PRINCIPAL -->
<div id="sistema" style="display:none;">

<h1>Sistema de monitoreo de sensores</h1>

<h3>Humedad</h3>
<input type="range" id="humedad" min="0" max="20" oninput="actualizar()">
<p id="valorH"></p>

<div class="led" id="ledH"></div>

<h3>Temperatura</h3>
<input type="range" id="temp" min="0" max="50" oninput="actualizar()">
<p id="valorT"></p>

<div class="led" id="ledT"></div>

</div>

<script src="script.js"></script>

</body>
</html>
