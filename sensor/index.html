<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de monitoreo</title>

<link rel="stylesheet" href="style.css">

<!-- tipografia similar a la del diseño -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Pacifico&display=swap" rel="stylesheet">

</head>

<body>

<div id="sistema">

<!-- TITULO -->
<div class="titulo">
<h1>ESTADO DE LOS <span>Sensores</span></h1>
</div>

<!-- ================= HUMEDAD ================= -->

<div class="sensor">

<h2>SENSOR DE HÚMEDAD</h2>

<div class="contenido">

<div class="sensor-izquierda">

<img src="img/humedad.png" class="icono">

<input type="range" id="humedad" min="0" max="100" value="40" oninput="actualizar()">

<div class="valor">
Húmedad <span id="valorH">40</span>%
</div>

</div>

<div class="monitor">

<h3>Estado de monitoreo</h3>

<img id="ledH" class="led" src="img/led_verde.png">

</div>

</div>

</div>

<!-- ================= TEMPERATURA ================= -->

<div class="sensor">

<h2>SENSOR DE TEMPERATURA</h2>

<div class="contenido">

<div class="sensor-izquierda">

<img src="img/temperatura.png" class="icono">

<input type="range" id="temp" min="0" max="50" value="20" oninput="actualizar()">

<div class="valor">
Temperatura <span id="valorT">20</span>°C
</div>

</div>

<div class="monitor">

<h3>Estado de monitoreo</h3>

<img id="ledT" class="led" src="img/led_azul.png">

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
