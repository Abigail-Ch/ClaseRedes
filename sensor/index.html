<!DOCTYPE html>
<html>
<head>
<title>Sistema de Monitoreo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->

<div id="login">

<h2>Inicio de sesión</h2>

<input type="text" id="usuario" placeholder="Usuario">
<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">Entrar</button>

<p id="error"></p>

</div>


<!-- SISTEMA -->

<div id="sistema" style="display:none;">

<h1 class="titulo">Estado de los Sensores</h1>


<!-- HUMEDAD -->

<div class="sensor">

<h3 class="etiqueta">Sensor de Humedad</h3>

<div class="contenedor">

<div class="lado-izq">

<img src="img/humedad.png" class="icono">

<input type="range" id="humedad" min="0" max="100" oninput="actualizarH()">

<p>Humedad <span id="valorH">0</span>%</p>

</div>

<div class="monitor">

<h3 class="estado">Estado de monitoreo</h3>

<div class="ledBox">
<img id="ledH" src="img/led_rojo.png">
</div>

</div>

</div>

</div>


<!-- PROXIMIDAD -->

<div class="sensor">

<h3 class="etiqueta">Sensor de Proximidad</h3>

<div class="contenedor">

<div class="lado-izq">

<img src="img/proximidad.png" class="icono">

<input type="number" id="distancia" placeholder="Metros">

<button onclick="actualizarProximidad()">ENTER</button>

<p>Proximidad <span id="valorP">0</span> m</p>

</div>

<div class="monitor">

<h3 class="estado">Estado de monitoreo</h3>

<div class="ledBox">
<img id="ledP" src="img/led_rojo.png">
</div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
