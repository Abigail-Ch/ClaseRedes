<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Sistema de Monitoreo</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Pacifico&display=swap" rel="stylesheet">

</head>

<body>

<div class="titulo">
ESTADO DE LOS <span>Sensores</span>
</div>


<!-- SENSOR HUMEDAD -->

<div class="sensor">

<div class="etiqueta">
SENSOR DE HÚMEDAD
</div>

<div class="contenedor">

<div class="lado-izq">

<img src="img/humedad.png" class="icono">

<input type="range" id="humedad" min="0" max="100" value="40" oninput="actualizar()">

<p>Húmedad <span id="valorH">40</span>%</p>

</div>


<div class="lado-der">

<div class="monitor">

<h3>Estado de monitoreo</h3>

<div class="ledBox">
<img id="ledH" src="img/led_verde.png">
</div>

</div>

</div>

</div>

</div>



<!-- SENSOR PROXIMIDAD -->

<div class="sensor">

<div class="etiqueta">
SENSOR DE PROXIMIDAD
</div>

<div class="contenedor">

<div class="lado-izq">

<img src="img/proximidad.png" class="icono">

<input type="number" id="distancia" placeholder="Metros">

<button onclick="actualizarProximidad()">ENTER</button>

<p>Proximidad <span id="valorP">0</span> m</p>

</div>


<div class="lado-der">

<div class="monitor">

<h3>Estado de monitoreo</h3>

<div class="ledBox">
<img id="ledP" src="img/led_rojo.png">
</div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
