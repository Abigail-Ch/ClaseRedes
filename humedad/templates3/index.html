<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="layout">

    <header class="header">
        <h1>💧 Monitor de Humedad</h1>
        <a href="{{ url_for('logout') }}" class="logout">Salir</a>
    </header>

    <main class="grid">

        <div class="card grande">
            <h2>Humedad</h2>
            <p id="humedad">--</p>

            <div class="barra-bg">
                <div id="barra" class="barra"></div>
            </div>
        </div>

        <div class="card">
            <h3>Rango</h3>
            <p id="rango">--</p>
        </div>

        <div class="card">
            <h3>Velocidad</h3>
            <p id="velocidad">--</p>
        </div>

        <div class="card">
            <h3>PWM</h3>
            <p id="pwm">--</p>
        </div>

        <div class="card estado">
            <h3>Estado</h3>
            <p id="estado">--</p>
        </div>

    </main>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
