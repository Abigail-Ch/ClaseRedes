<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="topbar">
    <h1>🌡️ Monitor de Humedad</h1>
    <a href="{{ url_for('logout') }}" class="btn-salir">Salir</a>
</div>

<div class="dashboard">

    <div class="card">
        <h2>Humedad</h2>
        <p id="humedad">--</p>
    </div>

    <div class="card">
        <h2>Rango</h2>
        <p id="rango">--</p>
    </div>

    <div class="card">
        <h2>Velocidad</h2>
        <p id="velocidad">--</p>
    </div>

    <div class="card estado">
        <h2>Estado del Sistema</h2>
        <p id="estado">Cargando...</p>
    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
