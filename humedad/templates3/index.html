<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Sensor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>🌡️ Monitor Inteligente</h1>

    <div class="grid">

        <div class="card">
            <h2>Humedad</h2>
            <p id="humedad">--</p>
            <span class="unit">%</span>
        </div>

        <div class="card">
            <h2>Rango</h2>
            <p id="rango">--</p>
        </div>

        <div class="card">
            <h2>Velocidad PWM</h2>
            <p id="velocidad">--</p>
        </div>

        <div class="card estado">
            <h2>Estado</h2>
            <p id="estado">Desconectado</p>
        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
