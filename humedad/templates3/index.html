<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard DHT11</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="container">
    <h1>Monitoreo del Sensor DHT11</h1>

    <!-- TARJETA HUMEDAD -->
    <div class="card">
        <h2>Humedad</h2>
        <p id="humedad">-- %</p>
    </div>

    <!-- TARJETA RANGO -->
    <div class="card">
        <h2>Rango</h2>
        <p id="rango">--</p>
    </div>

    <!-- TARJETA VELOCIDAD -->
    <div class="card">
        <h2>Velocidad PWM</h2>
        <p id="velocidad">--</p>
    </div>

    <!-- TARJETA ESTADO -->
    <div class="card">
        <h2>Estado del Sensor</h2>
        <p id="estado">Esperando datos...</p>
    </div>

    <!-- BOTÓN CERRAR SESIÓN -->
    <br>
    <a href="/logout">
        <button>Cerrar sesión</button>
    </a>

</div>

<script src="/static/script.js"></script>
</body>
</html>
